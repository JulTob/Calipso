name: Compilar y probar

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ada:
    name: Ada (GNAT + GPRbuild)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar GNAT y GPRbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y gnat gprbuild

      - name: Compilar
        run: gprbuild -p -P colapso.gpr

      - name: Pruebas
        run: ./bin/colapso_tests

      - name: Demo
        run: ./bin/colapso_demo data/muestra.txt "\nEl azúcar [40] y por eso debes lavarte los dientes.\n" 3

      - name: La demo en Ada y la referencia en Python deben escribir lo mismo
        run: |
          ./bin/colapso_demo data/muestra.txt "\nEl azúcar [40] y por eso debes lavarte los dientes.\n" 3 > salida_ada.txt
          python3 referencia/demo.py data/muestra.txt "\nEl azúcar [40] y por eso debes lavarte los dientes.\n" 3 > salida_python.txt
          diff salida_ada.txt salida_python.txt

      - name: Los puntos ciegos en Ada y en Python deben dar las mismas cifras
        run: |
          ./bin/colapso_ciegos data/muestra.txt 20 > ciegos_ada.txt
          python3 referencia/ciegos.py data/muestra.txt 20 > ciegos_python.txt
          cat ciegos_ada.txt
          diff ciegos_ada.txt ciegos_python.txt

      - name: El entrenamiento con puntos ciegos en Ada y en Python debe dar las mismas cifras
        run: |
          time ./bin/colapso_votos data/muestra.txt 1500 > votos_ada.txt
          time python3 referencia/votos.py data/muestra.txt 1500 > votos_python.txt
          cat votos_ada.txt
          diff votos_ada.txt votos_python.txt

  referencia:
    name: Referencia en Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pruebas de la referencia
        run: python3 referencia/pruebas.py

  alire:
    name: Alire (comprobar alire.toml)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: alire-project/setup-alire@v2
      - name: Compilar con Alire
        run: alr -n build
      - name: Pruebas
        run: ./bin/colapso_tests
