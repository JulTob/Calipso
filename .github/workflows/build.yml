name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ada:
    name: Ada (GNAT + GPRbuild)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install GNAT and GPRbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y gnat gprbuild

      - name: Build
        run: gprbuild -p -P calipso.gpr

      - name: Tests
        run: ./bin/calipso_tests

      - name: The demo in Ada and the Python reference must write the same
        run: |
          ./bin/calipso_demo data/sample_es.txt "\nEl azúcar [40] y por eso debes lavarte los dientes.\n" 3 > demo_ada.txt
          python3 reference/demo.py data/sample_es.txt "\nEl azúcar [40] y por eso debes lavarte los dientes.\n" 3 > demo_python.txt
          cat demo_ada.txt
          diff demo_ada.txt demo_python.txt

      - name: The blind-spot exam in Ada and in Python must give the same figures
        run: |
          ./bin/calipso_exam data/sample_es.txt 20 > exam_ada.txt
          python3 reference/exam.py data/sample_es.txt 20 > exam_python.txt
          cat exam_ada.txt
          diff exam_ada.txt exam_python.txt

      - name: A brain studies, is saved, carries on and is compared - the same in Ada and in Python
        run: |
          ./bin/calipso_brain study brain_ada.txt data/sample_es.txt 300 bias+position+decay > brain_ada_log.txt
          ./bin/calipso_brain study brain_ada.txt data/sample_es.txt 300 >> brain_ada_log.txt
          ./bin/calipso_brain study mixed_ada.txt data/sample_es.txt 200 counting+bias+harmonic >> brain_ada_log.txt
          python3 reference/brain.py study brain_python.txt data/sample_es.txt 300 bias+position+decay > brain_python_log.txt
          python3 reference/brain.py study brain_python.txt data/sample_es.txt 300 >> brain_python_log.txt
          python3 reference/brain.py study mixed_python.txt data/sample_es.txt 200 counting+bias+harmonic >> brain_python_log.txt
          cat brain_ada_log.txt
          sed -e 's/_python/_ada/g' brain_python_log.txt > brain_python_as_ada.txt
          diff brain_ada_log.txt brain_python_as_ada.txt

      - name: Each language can read the brains the other one saved
        run: |
          ./bin/calipso_brain compare data/sample_es.txt brain_python.txt mixed_python.txt > cross_ada.txt
          python3 reference/brain.py compare data/sample_es.txt brain_python.txt mixed_python.txt > cross_python.txt
          ./bin/calipso_brain compare data/sample_es.txt brain_ada.txt mixed_ada.txt > own_ada.txt
          python3 reference/brain.py compare data/sample_es.txt brain_ada.txt mixed_ada.txt > own_python.txt
          cat cross_ada.txt
          diff cross_ada.txt cross_python.txt
          diff own_ada.txt own_python.txt

  reference:
    name: Python reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Reference tests
        run: python3 reference/tests.py

  alire:
    name: Alire (check alire.toml)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: alire-project/setup-alire@v2
      - name: Build with Alire
        run: alr -n build
      - name: Tests
        run: ./bin/calipso_tests
